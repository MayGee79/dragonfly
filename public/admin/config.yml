# Production: https://dragonflypsychotherapy.co.uk (123.reg static hosting)
# Decap CMS login on 123.reg requires an external OAuth proxy; set auth_endpoint to that URL when available
backend:
  name: github
  repo: MayGee79/dragonfly
  branch: main
  base_url: https://dragonflypsychotherapy.co.uk
  auth_endpoint: /api/auth

media_folder: public/images
public_folder: /images

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", default: "home" }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            types:
              - label: "Hero Section"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Layout", name: "layout", widget: "select", options: ["text-only", "text-image", "image-text", "logo-header"], default: "text-only" }
                  - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
              - label: "Content Section"
                name: "content"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Content", name: "content", widget: "markdown" }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Layout", name: "layout", widget: "select", options: ["text-only", "text-image", "image-text", "three-column"], default: "text-only" }
                  - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
      - name: "faqs"
        label: "FAQs"
        file: "content/pages/faqs.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", default: "faqs" }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            types:
              - label: "Hero Section"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Layout", name: "layout", widget: "select", options: ["text-only", "text-image", "image-text", "logo-header"], default: "text-only" }
                  - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
              - label: "Content Section"
                name: "content"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Content", name: "content", widget: "markdown" }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Layout", name: "layout", widget: "select", options: ["text-only", "text-image", "image-text", "three-column"], default: "text-only" }
                  - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
      - name: "professional-membership"
        label: "Professional Profile"
        file: "content/pages/professional-membership.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", default: "professional-membership" }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - label: "Qualifications"
            name: "qualifications"
            widget: "list"
            fields:
              - { label: "Item", name: "item", widget: "string" }
          - label: "Recent Continuing Professional Development"
            name: "cpd"
            widget: "list"
            fields:
              - { label: "Item", name: "item", widget: "string" }
          - { label: "Membership Text (BACP info)", name: "membershipText", widget: "markdown" }
      - name: "testimonials"
        label: "Testimonials"
        file: "content/pages/testimonials.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", default: "testimonials" }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author (initials)", name: "author", widget: "string" }

  - name: "shop"
    label: "Shop"
    files:
      - name: "shop"
        label: "Shop"
        file: "content/shop.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string", default: "shop" }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Category Title", name: "categoryTitle", widget: "string" }
              - { label: "Category Description", name: "categoryDescription", widget: "text" }
              - label: "Products"
                name: "products"
                widget: "list"
                fields:
                  - { label: "Product Title", name: "productTitle", widget: "string" }
                  - { label: "Quantity (optional, e.g. 12)", name: "productQuantity", widget: "string", required: false }
                  - { label: "Link URL", name: "productLink", widget: "string" }
                  - { label: "Link Text", name: "linkText", widget: "string" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{title | slugify}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", default: "" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Published", name: "published", widget: "boolean", default: false }

