<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager - Dragonfly Psychotherapy</title>
  <link id="cms-config-link" rel="cms-config-url" href="/admin/config.yml" type="text/yaml" />
  <link rel="stylesheet" href="/admin/custom.css" />
</head>
<body>
  <script>
    (function () {
      var hostname = window.location.hostname
      var isLocal = hostname === 'localhost' || hostname === '127.0.0.1'
      var link = document.getElementById('cms-config-link')
      if (isLocal && link) link.setAttribute('href', '/admin/config.local.yml')
    })()
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
